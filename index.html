<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Infinite Scroooollll...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="blob-wrap" aria-hidden="true">
      <div class="blob one"></div>
      <div class="blob two"></div>
      <div class="blob three"></div>
    </div>

    <main class="hero">
      <p class="eyebrow">(echo...)</p>
      <h1>The Infinite Scroooollll...</h1>
      <div class="scroll" id="scroll-track" aria-label="Infinite scroll text"></div>
    </main>

    <div class="phase-overlay" id="phaseOverlay" aria-live="polite">
      <div class="phase-message">
        <h3 id="phaseText">You are now leaving The pit of redemption</h3>
      </div>
    </div>

    <div class="pit-overlay" id="pitOverlay" aria-live="polite">
      <div class="pit-message">
        <p class="label">Welcome to</p>
        <h2>The Pit of Redemptions</h2>
      </div>
    </div>

    <script>
      const scrollTrack = document.getElementById('scroll-track');
      const phaseOverlay = document.getElementById('phaseOverlay');
      const phaseText = document.getElementById('phaseText');
      const pitOverlay = document.getElementById('pitOverlay');

      const milestoneMessages = [
        'Welcome to the infinite road. It does not bend.',
        'The horizon keeps receding, but never closes.',
        'The first signs of silence are already near.',
        'This path has been walked by many, and still it moves.',
        'You are still going.',
        'The road keeps changing beneath your feet.',
        'The dark is not empty. It is listening.'
      ];

      const milestoneIndexes = [30, 110, 220, 390, 540];
      const travelDistance = 10000000;
      const maxVisibleRows = 5000;
      const batchSize = 80;
      const scrollBuffer = 1200;
      const pitStart = 1800000;
      const pitExitStart = 2600000;
      const depthsStart = 4600000;
      const depthsExitStart = 5600000;
      const endStart = 7600000;

      let renderedCount = 0;
      let pendingFrame = false;
      let generationEnded = false;
      let pitEntered = false;
      let pitExitShown = false;
      let depthsExitShown = false;
      let phaseMessageTimer = null;

      scrollTrack.style.minHeight = travelDistance + 'px';

      function setPhaseMessage(message) {
        phaseText.textContent = message;
        phaseOverlay.classList.add('visible');
        clearTimeout(phaseMessageTimer);
        phaseMessageTimer = setTimeout(() => {
          phaseOverlay.classList.remove('visible');
        }, 2100);
      }

      function buildLine(index) {
        const line = document.createElement('p');

        if (index >= endStart && index < endStart + 160) {
          line.className = 'milestone';
          line.textContent = 'the route ends here';
          return line;
        }

        if (milestoneIndexes.includes(index)) {
          const message = milestoneMessages[milestoneIndexes.indexOf(index) % milestoneMessages.length];
          line.className = 'milestone';
          line.textContent = message;
          return line;
        }

        if (index >= 9800 && index <= 10000) {
          line.className = 'milestone';
          line.textContent = 'the silence is almost complete';
          return line;
        }

        line.textContent = 'scroll';
        return line;
      }

      function addRows() {
        const fragment = document.createDocumentFragment();
        const count = Math.min(batchSize, maxVisibleRows - scrollTrack.children.length);

        for (let i = 0; i < count; i++) {
          if (generationEnded && renderedCount >= endStart + 600) {
            break;
          }
          fragment.appendChild(buildLine(renderedCount));
          renderedCount += 1;
        }

        if (fragment.childNodes.length) {
          scrollTrack.appendChild(fragment);
        }
      }

      function scheduleRows() {
        if (pendingFrame) return;
        pendingFrame = true;

        requestAnimationFrame(() => {
          pendingFrame = false;
          const distanceFromBottom = scrollTrack.scrollHeight - (window.scrollY + window.innerHeight);

          if (distanceFromBottom < scrollBuffer) {
            addRows();
          }
        });
      }

      function updatePhaseState() {
        const depth = window.scrollY || document.documentElement.scrollTop;

        document.body.classList.remove('pit-mode', 'red-mode', 'depth-mode');
        pitOverlay.classList.remove('visible');

        if (depth >= pitStart && depth < pitExitStart) {
          document.body.classList.add('pit-mode');
          pitOverlay.classList.add('visible');

          if (!pitEntered) {
            pitEntered = true;
            setTimeout(() => {
              document.body.classList.remove('pit-mode');
              document.body.classList.add('red-mode');
            }, 1850);
          }
        }

        if (depth >= pitExitStart && depth < depthsStart) {
          document.body.classList.add('red-mode');

          if (!pitExitShown) {
            pitExitShown = true;
            setPhaseMessage('You are now leaving The pit of redemption');
          }
        }

        if (depth >= depthsStart && depth < depthsExitStart) {
          document.body.classList.add('depth-mode');
        }

        if (depth >= depthsExitStart && depth < endStart) {
          if (!depthsExitShown) {
            depthsExitShown = true;
            setPhaseMessage('You are now leaving The broken depths');
          }
          document.body.classList.remove('depth-mode');
          document.body.classList.add('red-mode');
        }

        if (depth >= endStart) {
          document.body.classList.remove('pit-mode', 'red-mode', 'depth-mode');
          generationEnded = true;
        }
      }

      for (let i = 0; i < 40; i++) {
        addRows();
      }

      window.addEventListener('scroll', () => {
        scheduleRows();
        updatePhaseState();
      }, { passive: true });

      window.addEventListener('resize', scheduleRows, { passive: true });
      updatePhaseState();
    </script>
  </body>
</html>
